<!DOCTYPE html>
<html>
	<head>

	</head>
	<body>
		<form>
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="firstname"><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lastname"><br><br>
  <input type="submit" value="Submit" id="submit">
</form> 
<ul class="usersAnswer"></ul>
<script>
	const form=document.querySelector('form')
	console.log(form)
	const fname=document.getElementById("fname")
	console.log(fname)
	const lname=document.getElementById("lname")
	console.log(lname)
	const firstnameInput = document.querySelector('input[name="firstname"]')
	console.log(firstnameInput)
	const lastnameInput = document.querySelector('input[name="lastname"]')
	console.log(lastnameInput)

	form.addEventListener('submit', function(event) {
		event.preventDefault() 

		const firstName = fname.value.trim()
		const lastName = lname.value.trim()
		if (!firstName || !lastName) return

		const usersAnswer = document.querySelector('.usersAnswer')
		const firstNameItem = document.createElement('li')
		firstNameItem.textContent = firstName
		const lastNameItem = document.createElement('li')
		lastNameItem.textContent = lastName
		usersAnswer.append(firstNameItem, lastNameItem)
	})

</script>
	</body>
	
</html>
