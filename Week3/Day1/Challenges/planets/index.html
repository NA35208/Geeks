<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
     
body {
    background-color: #050816;
    color: white;
    padding: 20px;
    margin: 0;
    font-family: Arial, sans-serif;
}

.listPlanets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 100px;
    padding: 60px 30px;
}

.planet {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
    z-index: 1;
}

.moon {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e6e6e6;
    border: 1px solid #999;
    pointer-events: none;
}

        </style>
    </head>
    <body>

    <section class="listPlanets"></section>

    <script src="planet.js"></script>
    </body>
</html>
